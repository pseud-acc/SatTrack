models:
  - name: int__jsr__satellite_catalogue
    description: "One row per GCAT object (satcat + satcat100k), vague dates parsed, undocumented codes nulled. Undocumented values become NULL here; raw values stay in staging (decided 2026-10-25)."
    data_tests:
      - model_health:
          name: mh__int__jsr__satellite_catalogue__pk_unique
          arguments: {check: pk_unique, columns: [jcat]}
      - model_health:
          name: mh__int__jsr__satellite_catalogue__pk_not_null
          arguments: {check: pk_not_null, columns: [jcat]}
      - model_health:
          name: mh__int__jsr__satellite_catalogue__row_count_match
          arguments:
            check: row_count_match
            compare_to: "ref('stg__jsr__satcat')"
            relationship: gte
    columns:
      - name: jcat
        description: '{{ doc("col__jcat") }}'
      - name: satcat_ref
        description: '{{ doc("col__satcat_ref") }}'
      - name: launch_tag
