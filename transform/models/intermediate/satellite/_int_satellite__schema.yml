  - name: int__jsr__satellite_parent_payload
    description: "One row per GCAT object (satcat + satcat100k): for rocket stages, components and debris (GCAT Type R / C / D), the first payload reached by following GCAT Parent links (cols.html: the 'parent object' the object is attached to at the start of the phase, an Extended JCAT ID). The walk stops at the first payload, at a parent outside the ingested catalogues, at a repeat (cycle) or after 10 steps. Payloads never inherit."
    data_tests:
      - model_health:
          name: mh__int__jsr__satellite_parent_payload__pk_unique
          arguments:
            check: pk_unique
            columns:
              - jcat
      - model_health:
          name: mh__int__jsr__satellite_parent_payload__pk_not_null
          arguments:
            check: pk_not_null
            columns:
              - jcat
      - model_health:
          name: mh__int__jsr__satellite_parent_payload__row_count_match
          arguments:
            check: row_count_match
            compare_to: "ref('int__jsr__satellite_catalogue')"
            relationship: equal
    columns:
      - name: jcat
        description: '{{ doc("col__jcat") }}'
      - name: sat_type_class
        description: '{{ doc("col__sat_type_class") }}'
      - name: parent_ref
        description: '{{ doc("col__parent_ref") }}'
      - name: parent_jcat
        description: '{{ doc("col__parent_jcat") }}'
      - name: parent_payload_jcat
        description: '{{ doc("col__parent_payload_jcat") }}'
        data_tests:
          - relationships:
              name: fk__int__jsr__satellite_parent_payload__parent_payload_jcat
              arguments:
                to: "ref('int__jsr__satellite_catalogue')"
                field: jcat
      - name: parent_payload_depth
        description: '{{ doc("col__parent_payload_depth") }}'
      - name: parent_payload_search_outcome
        description: '{{ doc("col__parent_payload_search_outcome") }}'
        data_tests:
          - not_null:
              name: not_null__int__jsr__satellite_parent_payload__parent_payload_search_outcome
          - accepted_values:
              name: accepted_values__int__jsr__satellite_parent_payload__parent_payload_search_outcome
              arguments:
                values:
                  - payload_found
                  - payload_object
                  - no_parent_object
                  - parent_not_in_catalogue
                  - chain_ends_without_payload
                  - chain_limit
                  - type_unclassified
      - name: inserted_date_time
        description: '{{ doc("col__inserted_date_time") }}'
      - name: inserted_by
        description: '{{ doc("col__inserted_by") }}'
  - name: int__xsrc__satellite_gcat_matched
    description: "One row per object in the Space-Track GP feed, linked to its GCAT JCAT with the GCAT catalogue fields the master needs. GCAT: 'Sequence numbers in the S catalog are in one-to-one correspondence with the US SATCAT catalog numbers', so link by 'S' + lpad(NORAD, 5) first, then by a COSPAR ID that identifies one GCAT object (decided 2026-10-25)."
    data_tests:
      - model_health:
          name: mh__int__xsrc__satellite_gcat_matched__pk_unique
          arguments: {check: pk_unique, columns: [satcat_id]}
      - model_health:
          name: mh__int__xsrc__satellite_gcat_matched__pk_not_null
          arguments: {check: pk_not_null, columns: [satcat_id]}
      - model_health:
          name: mh__int__xsrc__satellite_gcat_matched__row_count_match
          arguments:
            check: row_count_match
            compare_to: "ref('int__spacetrack__satellite_catalogue')"
            relationship: equal
    columns:
      - name: satcat_id
        description: '{{ doc("col__satcat_id") }}'
      - name: canonical_satellite_id
        description: '{{ doc("col__canonical_satellite_id") }}'
      - name: jcat
        description: '{{ doc("col__jcat") }}'
        data_tests:
          - unique:
              name: unique__int__xsrc__satellite_gcat_matched__jcat
          - relationships:
              name: fk__int__xsrc__satellite_gcat_matched__jcat
              arguments: {to: "ref('int__jsr__satellite_catalogue')", field: jcat}
      - name: jcat_link_method
        description: '{{ doc("col__jcat_link_method") }}'
      - name: flag_gcat_matched
