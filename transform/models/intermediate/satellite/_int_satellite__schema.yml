  - name: int__jsr__satellite_status
    description: "One row per GCAT object in the Current Catalog or the payload catalogs: operating / transmitting primitives (D9), current-catalog activity, and the GCAT activity signal used by the status rule (decided 2026-10-25): flag_gcat_active = (TOp = '*' OR currentcat Active = 'A') AND TF <> 'Z' (zombie = Inactive), set for payload rows only. Ownership class and mission category codes get GCAT's rule-derived short labels; unlabelled codes show raw. Rocket stages, components and debris without a payload record take mission_category_list / mission_category_labels / satellite_program / satellite_program_family from the payload their GCAT Parent chain leads to (int__jsr__satellite_parent_payload); mission_details_source says which. The raw mission_category stays the object's own."
    data_tests:
      - model_health:
          name: mh__int__jsr__satellite_status__pk_unique
          arguments: {check: pk_unique, columns: [jcat]}
      - model_health:
          name: mh__int__jsr__satellite_status__pk_not_null
          arguments: {check: pk_not_null, columns: [jcat]}
      - model_health:
          name: mh__int__jsr__satellite_status__row_count_match
          arguments:
            check: row_count_match
            compare_to: "ref('int__jsr__satellite_current')"
            relationship: gte
    columns:
