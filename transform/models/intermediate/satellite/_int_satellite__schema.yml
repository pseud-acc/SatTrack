      - name: last_active_date_precision
        description: '{{ doc("col__last_active_date_precision") }}'
      - name: end_of_life_code
        description: '{{ doc("col__end_of_life_code") }}'
      - name: maneuverability
        description: '{{ doc("col__maneuverability") }}'
      - name: ownership_class
        description: '{{ doc("col__ownership_class") }}'
      - name: ownership_class_labels
        description: '{{ doc("col__ownership_class_labels") }}'
      - name: mission_category
        description: '{{ doc("col__mission_category") }}'
      - name: mission_category_list
        description: '{{ doc("col__mission_category_list") }}'
      - name: mission_category_labels
        description: '{{ doc("col__mission_category_labels") }}'
      - name: flag_mission_category_uncertain
