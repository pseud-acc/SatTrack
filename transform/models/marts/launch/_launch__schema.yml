models:
  - name: dim__launch_site
    description: "One row per GCAT launch site, with its responsible state and physical location country."
    config:
      access: public
    data_tests:
      - model_health:
          name: mh__dim__launch_site__pk_unique
          arguments: {check: pk_unique, columns: [site_code]}
      - model_health:
          name: mh__dim__launch_site__pk_not_null
          arguments: {check: pk_not_null, columns: [site_code]}
      - model_health:
          name: mh__dim__launch_site__row_count_match
          arguments:
            check: row_count_match
            compare_to: "ref('int__jsr__launch_sites')"
            relationship: equal
    columns:
      - name: site_code
        data_type: varchar
        description: '{{ doc("col__site_code") }}'
        constraints:
          - type: not_null
      - name: site_ucode
        data_type: varchar
        description: '{{ doc("col__site_ucode") }}'
      - name: site_type
        data_type: varchar
        description: '{{ doc("col__site_type") }}'
      - name: site_short_name
        data_type: varchar
        description: '{{ doc("col__site_short_name") }}'
      - name: site_name
        data_type: varchar
        description: '{{ doc("col__site_name") }}'
      - name: site_display_name
        data_type: varchar
        description: '{{ doc("col__site_display_name") }}'
      - name: site_latitude
        data_type: double
        description: '{{ doc("col__site_latitude") }}'
      - name: site_longitude
        data_type: double
        description: '{{ doc("col__site_longitude") }}'
      - name: site_location
        data_type: varchar
        description: '{{ doc("col__site_location") }}'
      - name: site_operator_code
        data_type: varchar
        description: '{{ doc("col__site_operator_code") }}'
      - name: site_state_code
        data_type: varchar
        description: '{{ doc("col__site_state_code") }}'
      - name: site_state
        data_type: varchar
        description: '{{ doc("col__site_state") }}'
      - name: site_location_country
        data_type: varchar
        description: '{{ doc("col__site_location_country") }}'
      - name: site_location_iso_alpha2
        data_type: varchar
        description: '{{ doc("col__site_location_iso_alpha2") }}'
      - name: site_location_country_sk
        data_type: varchar
        description: '{{ doc("col__site_location_country_sk") }}'
        data_tests:
          - relationships:
              name: fk__dim__launch_site__site_location_country_sk
              arguments:
                to: "ref('dim__country')"
                field: country_sk
      - name: site_location_method
        data_type: varchar
        description: '{{ doc("col__site_location_method") }}'
      - name: nearest_city
        data_type: varchar
        description: '{{ doc("col__nearest_city") }}'
      - name: nearest_city_km
        data_type: double
        description: '{{ doc("col__nearest_city_km") }}'
      - name: site_start_date
        data_type: timestamp
        description: '{{ doc("col__site_start_date") }}'
      - name: site_start_date_start
        data_type: timestamp
        description: '{{ doc("col__site_start_date_start") }}'
      - name: site_start_date_end
        data_type: timestamp
        description: '{{ doc("col__site_start_date_end") }}'
      - name: site_start_date_precision
        data_type: varchar
        description: '{{ doc("col__site_start_date_precision") }}'
      - name: flag_site_active
        data_type: integer
        description: '{{ doc("col__flag_site_active") }}'
      - name: _source_updated_at
        data_type: timestamp
        description: '{{ doc("col___source_updated_at") }}'
      - name: inserted_date_time
        data_type: timestamp
        description: '{{ doc("col__inserted_date_time") }}'
      - name: inserted_by
        data_type: varchar
        description: '{{ doc("col__inserted_by") }}'
  - name: dim__launch_vehicle
    description: "One row per launch vehicle name, with its brand, family, class, manufacturers and performance figures."
    config:
      access: public
    data_tests:
      - model_health:
          name: mh__dim__launch_vehicle__pk_unique
          arguments: {check: pk_unique, columns: [launch_vehicle_name]}
      - model_health:
          name: mh__dim__launch_vehicle__pk_not_null
          arguments: {check: pk_not_null, columns: [launch_vehicle_name]}
      - model_health:
          name: mh__dim__launch_vehicle__row_count_match
          arguments:
            check: row_count_match
            compare_to: "ref('int__jsr__launch_vehicles')"
            relationship: equal
    columns:
      - name: launch_vehicle_name
        data_type: varchar
        description: '{{ doc("col__launch_vehicle_name") }}'
        constraints:
          - type: not_null
      - name: launch_vehicle_brand
        data_type: varchar
        description: '{{ doc("col__launch_vehicle_brand") }}'
      - name: launch_vehicle_family
        data_type: varchar
        description: '{{ doc("col__launch_vehicle_family") }}'
      - name: launch_vehicle_generic_name
        data_type: varchar
        description: '{{ doc("col__launch_vehicle_generic_name") }}'
      - name: launch_vehicle_class
        data_type: varchar
        description: '{{ doc("col__launch_vehicle_class") }}'
      - name: launch_vehicle_manufacturer_codes
        data_type: varchar[]
        description: '{{ doc("col__launch_vehicle_manufacturer_codes") }}'
      - name: launch_vehicle_manufacturer_names
        data_type: varchar[]
        description: '{{ doc("col__launch_vehicle_manufacturer_names") }}'
      - name: launch_vehicle_variant
        data_type: varchar
        description: '{{ doc("col__launch_vehicle_variant") }}'
      - name: launch_vehicle_alias
        data_type: varchar
        description: '{{ doc("col__launch_vehicle_alias") }}'
      - name: launch_vehicle_length_m
        data_type: double
        description: '{{ doc("col__launch_vehicle_length_m") }}'
      - name: launch_vehicle_diameter_m
        data_type: double
        description: '{{ doc("col__launch_vehicle_diameter_m") }}'
      - name: launch_vehicle_launch_mass_t
        data_type: double
        description: '{{ doc("col__launch_vehicle_launch_mass_t") }}'
      - name: launch_vehicle_leo_capacity_kg
        data_type: double
        description: '{{ doc("col__launch_vehicle_leo_capacity_kg") }}'
      - name: launch_vehicle_gto_capacity_kg
        data_type: double
        description: '{{ doc("col__launch_vehicle_gto_capacity_kg") }}'
      - name: launch_vehicle_takeoff_thrust_kn
        data_type: double
        description: '{{ doc("col__launch_vehicle_takeoff_thrust_kn") }}'
      - name: _source_updated_at
        data_type: timestamp
        description: '{{ doc("col___source_updated_at") }}'
      - name: inserted_date_time
        data_type: timestamp
        description: '{{ doc("col__inserted_date_time") }}'
      - name: inserted_by
        data_type: varchar
        description: '{{ doc("col__inserted_by") }}'
  - name: fct__launch_event
    description: "One row per payload launch from the GCAT launch log, with the launch category and success code split out."
    config:
      access: public
    data_tests:
      - model_health:
          name: mh__fct__launch_event__pk_unique
          arguments: {check: pk_unique, columns: [jcat]}
      - model_health:
          name: mh__fct__launch_event__pk_not_null
          arguments: {check: pk_not_null, columns: [jcat]}
      - model_health:
          name: mh__fct__launch_event__row_count_match
          arguments:
            check: row_count_match
            compare_to: "ref('int__jsr__launch_events')"
            relationship: equal
    columns:
      - name: jcat
        data_type: varchar
        description: '{{ doc("col__jcat") }}'
        constraints:
          - type: not_null
      - name: launch_tag
        data_type: varchar
        description: '{{ doc("col__launch_tag") }}'
      - name: launch_datetime
        data_type: timestamp
        description: '{{ doc("col__launch_datetime") }}'
      - name: launch_datetime_start
        data_type: timestamp
        description: '{{ doc("col__launch_datetime_start") }}'
      - name: launch_datetime_end
        data_type: timestamp
        description: '{{ doc("col__launch_datetime_end") }}'
      - name: launch_datetime_precision
        data_type: varchar
        description: '{{ doc("col__launch_datetime_precision") }}'
      - name: cospar_id
        data_type: varchar
        description: '{{ doc("col__cospar_id") }}'
      - name: flag_catalog_match_uncertain
        data_type: integer
        description: '{{ doc("col__flag_catalog_match_uncertain") }}'
      - name: site_code
        data_type: varchar
        description: '{{ doc("col__site_code") }}'
        data_tests:
          - relationships:
              name: fk__fct__launch_event__site_code
              arguments:
                to: "ref('dim__launch_site')"
                field: site_code
      - name: flag_site_uncertain
        data_type: integer
        description: '{{ doc("col__flag_site_uncertain") }}'
      - name: launch_pad
        data_type: varchar
        description: '{{ doc("col__launch_pad") }}'
      - name: ascent_site_code
        data_type: varchar
        description: '{{ doc("col__ascent_site_code") }}'
      - name: ascent_pad
        data_type: varchar
        description: '{{ doc("col__ascent_pad") }}'
      - name: launch_platform
        data_type: varchar
        description: '{{ doc("col__launch_platform") }}'
      - name: launch_vehicle_type
        data_type: varchar
        description: '{{ doc("col__launch_vehicle_type") }}'
        data_tests:
          - relationships:
              name: fk__fct__launch_event__launch_vehicle_type
              arguments:
                to: "ref('dim__launch_vehicle')"
                field: launch_vehicle_name
      - name: launch_vehicle_brand
        data_type: varchar
        description: '{{ doc("col__launch_vehicle_brand") }}'
      - name: flight_id
        data_type: varchar
        description: '{{ doc("col__flight_id") }}'
      - name: launch_agency_code
        data_type: varchar
        description: '{{ doc("col__launch_agency_code") }}'
      - name: launch_agency_country
        data_type: varchar
        description: '{{ doc("col__launch_agency_country") }}'
      - name: launch_code
        data_type: varchar
        description: '{{ doc("col__launch_code") }}'
      - name: launch_category
        data_type: varchar
        description: '{{ doc("col__launch_category") }}'
      - name: launch_success_code
        data_type: varchar
        description: '{{ doc("col__launch_success_code") }}'
      - name: launch_time_ref
        data_type: varchar
        description: '{{ doc("col__launch_time_ref") }}'
      - name: current_owner_code
        data_type: varchar
        description: '{{ doc("col__current_owner_code") }}'
      - name: current_owner_state_code
        data_type: varchar
        description: '{{ doc("col__current_owner_state_code") }}'
      - name: _source_updated_at
        data_type: timestamp
        description: '{{ doc("col___source_updated_at") }}'
      - name: inserted_date_time
        data_type: timestamp
        description: '{{ doc("col__inserted_date_time") }}'
      - name: inserted_by
        data_type: varchar
        description: '{{ doc("col__inserted_by") }}'
