models:
  - name: fct__gp_elements
    description: "One row per on-orbit object in the Space-Track GP feed: orbital elements, TLE lines and the derived orbit class. The app's tracking table."
    config:
      access: public
    data_tests:
      - model_health:
          name: mh__fct__gp_elements__pk_unique
          arguments: {check: pk_unique, columns: [satcat_id]}
      - model_health:
          name: mh__fct__gp_elements__pk_not_null
          arguments: {check: pk_not_null, columns: [satcat_id]}
      - model_health:
          name: mh__fct__gp_elements__row_count_match
          arguments:
            check: row_count_match
            compare_to: "ref('int__spacetrack__satellite_catalogue')"
            relationship: equal
    columns:
      - name: satcat_id
        data_type: integer
        description: '{{ doc("col__satcat_id") }}'
        data_tests:
          - relationships:
              name: fk__fct__gp_elements__satcat_id
              arguments:
                to: "ref('fct__satellite_master')"
                field: satcat_id
        constraints:
          - type: not_null
      - name: object_name
        data_type: varchar
        description: '{{ doc("col__object_name") }}'
      - name: object_id
        data_type: varchar
        description: '{{ doc("col__object_id") }}'
      - name: object_type
        data_type: varchar
        description: '{{ doc("col__object_type") }}'
      - name: country_code
        data_type: varchar
        description: '{{ doc("col__country_code") }}'
      - name: launch_date
        data_type: date
        description: '{{ doc("col__launch_date") }}'
      - name: launch_site
        data_type: varchar
        description: '{{ doc("col__launch_site") }}'
      - name: epoch
        data_type: timestamp
        description: '{{ doc("col__epoch") }}'
      - name: mean_motion
        data_type: double
        description: '{{ doc("col__mean_motion") }}'
      - name: eccentricity
        data_type: double
        description: '{{ doc("col__eccentricity") }}'
      - name: inclination
        data_type: double
        description: '{{ doc("col__inclination") }}'
      - name: ra_of_asc_node
        data_type: double
        description: '{{ doc("col__ra_of_asc_node") }}'
      - name: arg_of_pericenter
        data_type: double
        description: '{{ doc("col__arg_of_pericenter") }}'
      - name: mean_anomaly
        data_type: double
        description: '{{ doc("col__mean_anomaly") }}'
      - name: bstar
        data_type: double
        description: '{{ doc("col__bstar") }}'
      - name: semimajor_axis
        data_type: double
        description: '{{ doc("col__semimajor_axis") }}'
      - name: orbital_period
        data_type: double
        description: '{{ doc("col__orbital_period") }}'
      - name: apoapsis
        data_type: double
        description: '{{ doc("col__apoapsis") }}'
      - name: periapsis
        data_type: double
        description: '{{ doc("col__periapsis") }}'
      - name: rcs_size
        data_type: varchar
        description: '{{ doc("col__rcs_size") }}'
      - name: tle_line_1
        data_type: varchar
        description: '{{ doc("col__tle_line_1") }}'
      - name: tle_line_2
        data_type: varchar
        description: '{{ doc("col__tle_line_2") }}'
      - name: orbit_class
        data_type: varchar
        description: '{{ doc("col__orbit_class") }}'
      - name: tle_age_days
        data_type: double
        description: '{{ doc("col__tle_age_days") }}'
      - name: _loaded_at
        data_type: timestamp
        description: '{{ doc("col___loaded_at") }}'
      - name: inserted_date_time
        data_type: timestamp
        description: '{{ doc("col__inserted_date_time") }}'
      - name: inserted_by
        data_type: varchar
        description: '{{ doc("col__inserted_by") }}'
