version: 2

macros:
  - name: helper__explode_org_codes
    description: "Renders a query that explodes a GCAT composite organisation code (e.g. 'GSFC/ESA', 'ESA?') into one row per organisation. Keeps every co-organisation (the app's multi-select organisation filter needs them). Output: map_sk (hashed surrogate key, D6), entity_key, org_role, org_code, org_code_order, org_code_raw, flag_multiple_orgs, flag_org_uncertain, org_code_split_rule."
    arguments:
      - name: relation
        type: relation
        description: "Upstream relation (e.g. a source CTE name)."
      - name: key_col
        type: string
        description: "Column identifying the entity (e.g. jcat, launch_vehicle_name)."
      - name: code_col
        type: string
        description: "Column holding the GCAT organisation code."
      - name: role
        type: string
        description: "Role label written to org_role, e.g. owner, manufacturer, launch_agency."
