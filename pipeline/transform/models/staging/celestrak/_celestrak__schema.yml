version: 2

models:
  - name: stg__celestrak__gp_group_member
    description: '{{ doc("tbl__celestrak__gp_group_member") }}'
    data_tests:
      - model_health:
          name: mh__stg__celestrak__gp_group_member__pk_unique
          arguments: {check: pk_unique, columns: [celestrak_group, satcat_id]}
      - model_health:
          name: mh__stg__celestrak__gp_group_member__pk_not_null
          arguments: {check: pk_not_null, columns: [celestrak_group, satcat_id]}
      - model_health:
          name: mh__stg__celestrak__gp_group_member__row_count_match
          arguments: {check: row_count_match, compare_to: "source('celestrak', 'gp_group_member')", relationship: equal}
    columns:
      - name: celestrak_group
        description: '{{ doc("col__celestrak_group") }}'
      - name: satcat_id
        description: '{{ doc("col__satcat_id") }}'
      - name: object_name
        description: '{{ doc("col__object_name") }}'
      - name: object_id
        description: '{{ doc("col__object_id") }}'
      - name: _loaded_at
        description: '{{ doc("col___loaded_at") }}'
      - name: _run_id
        description: '{{ doc("col___run_id") }}'
  - name: stg__celestrak__gp_group_index
    description: '{{ doc("tbl__celestrak__gp_group_index") }}'
    data_tests:
      - model_health:
          name: mh__stg__celestrak__gp_group_index__pk_unique
          arguments: {check: pk_unique, columns: [celestrak_group]}
      - model_health:
          name: mh__stg__celestrak__gp_group_index__pk_not_null
          arguments: {check: pk_not_null, columns: [celestrak_group]}
      - model_health:
          name: mh__stg__celestrak__gp_group_index__row_count_match
          arguments: {check: row_count_match, compare_to: "source('celestrak', 'gp_group_index')", relationship: equal}
    columns:
      - name: celestrak_group
        description: '{{ doc("col__celestrak_group") }}'
      - name: celestrak_group_title
        description: '{{ doc("col__celestrak_group_title") }}'
      - name: _loaded_at
        description: '{{ doc("col___loaded_at") }}'
      - name: _run_id
        description: '{{ doc("col___run_id") }}'
  - name: stg__celestrak__group_config
    description: '{{ doc("tbl__celestrak__group_config") }}'
    data_tests:
      - model_health:
          name: mh__stg__celestrak__group_config__pk_unique
          arguments: {check: pk_unique, columns: [celestrak_group]}
      - model_health:
          name: mh__stg__celestrak__group_config__pk_not_null
          arguments: {check: pk_not_null, columns: [celestrak_group]}
      - model_health:
          name: mh__stg__celestrak__group_config__row_count_match
          arguments: {check: row_count_match, compare_to: "source('celestrak', 'group_config')", relationship: equal}
    columns:
      - name: celestrak_group
        description: '{{ doc("col__celestrak_group") }}'
      - name: celestrak_group_kind
        description: '{{ doc("col__celestrak_group_kind") }}'
        data_tests:
          - accepted_values:
              name: accepted_values__stg__celestrak__group_config__celestrak_group_kind
              arguments: {values: ["constellation", "operator", "station", "excluded"]}
      - name: celestrak_group_order
        description: '{{ doc("col__celestrak_group_order") }}'
      - name: _loaded_at
        description: '{{ doc("col___loaded_at") }}'
      - name: _run_id
        description: '{{ doc("col___run_id") }}'
