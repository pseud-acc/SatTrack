version: 2

sources:
  - name: celestrak
    description: '{{ doc("src__celestrak") }}'
    schema: raw_celestrak
    loader: sattrack_ingest
    config:
      tags: ["enrichment"]   # selects the source and its schema-drift guards with its swap unit
      meta:
        owner: "CelesTrak (Dr T.S. Kelso), celestrak.org"
        pipeline_owner: "SatTrack maintainer"
        origin_type: rest_api
        endpoint: "https://celestrak.org/NORAD/elements/gp.php?GROUP=<group>&FORMAT=csv and the GP index page"
        auth: "none"
        format: csv
        update_frequency: "CelesTrak updates GP every 2 hours; SatTrack downloads at most once per 20 hours (proposed D-039)"
        licence_terms: "CelesTrak usage policy (2026-11-16); credit 'Constellation groups: CelesTrak (Dr T.S. Kelso)' (D-026)"
        rate_limits: "Once per update; stop on any non-200; no retries; no requests for 20 h after a refusal (D-008, D-039)"
        ingestion_module: sattrack_ingest.celestrak_groups.ingest_celestrak_groups
        known_quirks:
          - "A refused or failed download keeps the last good copy; a first run that gets nothing lands empty tables"
          - "Group titles are parsed from the GP index page's HTML"
      loaded_at_field: "cast(_loaded_at as timestamp)"
      freshness:
        # D-008: warn only after 3 refused days in a row (runner IPs are shared); never an error.
        warn_after: {count: 72, period: hour}
    tables:
      - name: gp_group_member
        description: '{{ doc("tbl__celestrak__gp_group_member") }}'
        config:
          meta: {natural_key: "GROUP, NORAD_CAT_ID"}
        data_tests:
          - dbt_expectations.expect_table_columns_to_contain_set:
              name: schema_columns__src__celestrak__gp_group_member
              config: {severity: warn}   # D-026: CelesTrak never holds a unit; ingestion checks the header first
              arguments:
                column_list: [GROUP, NORAD_CAT_ID, OBJECT_NAME, OBJECT_ID]
      - name: gp_group_index
        description: '{{ doc("tbl__celestrak__gp_group_index") }}'
        config:
          meta: {natural_key: GROUP}
        data_tests:
          - dbt_expectations.expect_table_columns_to_contain_set:
              name: schema_columns__src__celestrak__gp_group_index
              config: {severity: warn}
              arguments:
                column_list: [GROUP, GROUP_TITLE, INDEX_POSITION]
      - name: group_config
        description: '{{ doc("tbl__celestrak__group_config") }}'
        config:
          meta: {natural_key: GROUP}
        data_tests:
          - dbt_expectations.expect_table_columns_to_contain_set:
              name: schema_columns__src__celestrak__group_config
              config: {severity: warn}
              arguments:
                column_list: [GROUP, GROUP_KIND, GROUP_ORDER]
