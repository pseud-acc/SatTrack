      - name: activity_type
        description: '{{ doc("col__activity_type") }}'
        data_tests:
          - accepted_values:
              name: undocumented_values__stg__jsr__currentcat__activity_type
              arguments: {values: ["A", "C", "D", "P", "R", "Z"]}
