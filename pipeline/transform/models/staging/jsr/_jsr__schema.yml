models:
  - name: stg__jsr__satcat
    description: "GCAT object catalog, renamed and cast (vague dates kept as text)."
    data_tests:
      - model_health:
          name: mh__stg__jsr__satcat__pk_unique
          arguments: {check: pk_unique, columns: [jcat]}
      - model_health:
          name: mh__stg__jsr__satcat__pk_not_null
          arguments: {check: pk_not_null, columns: [jcat]}
      - model_health:
          name: mh__stg__jsr__satcat__row_count_match
          arguments: {check: row_count_match, compare_to: "source('jsr', 'satcat')", relationship: equal}
    columns:
      - name: jcat
        description: '{{ doc("col__jcat") }}'
  - name: stg__jsr__satcat100k
    description: "GCAT satcat100k, same columns as stg__jsr__satcat."
    data_tests:
      - model_health:
          name: mh__stg__jsr__satcat100k__pk_unique
          arguments: {check: pk_unique, columns: [jcat]}
      - model_health:
          name: mh__stg__jsr__satcat100k__pk_not_null
