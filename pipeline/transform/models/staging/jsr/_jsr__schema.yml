          arguments: {check: row_count_match, compare_to: "source('jsr', 'psatcat100k')", relationship: equal}
    columns:
      - name: jcat
        description: '{{ doc("col__jcat") }}'
  - name: stg__jsr__currentcat
    description: "GCAT current catalog, renamed and cast."
