      - model_health:
          name: mh__stg__jsr__satcat100k__row_count_match
          arguments: {check: row_count_match, compare_to: "source('jsr', 'satcat100k')", relationship: equal}
    columns:
      - name: jcat
        description: '{{ doc("col__jcat") }}'
