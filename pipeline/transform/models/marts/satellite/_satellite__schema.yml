models:
  - name: fct__satellite_master
    description: "One row per object in the Space-Track GP feed, combining Space-Track and GCAT primitives under the decided composite rules (field review 2026-10-25), plus its constellation and satellite systems (D-047). The app's satellite table."
    config:
      access: public
    data_tests:
      - model_health:
          name: mh__fct__satellite_master__pk_unique
          arguments: {check: pk_unique, columns: [canonical_satellite_id]}
      - model_health:
          name: mh__fct__satellite_master__pk_not_null
          arguments: {check: pk_not_null, columns: [canonical_satellite_id]}
      - model_health:
          name: mh__fct__satellite_master__row_count_match
          arguments:
            check: row_count_match
            compare_to: "ref('int__xsrc__satellite_gcat_matched')"
            relationship: equal
    columns:
      - name: canonical_satellite_id
        data_type: varchar
        description: '{{ doc("col__canonical_satellite_id") }}'
        constraints:
          - type: not_null
      - name: satcat_id
        data_type: integer
        description: '{{ doc("col__satcat_id") }}'
        config:
          meta:
            label: "SATCAT number"
      - name: jcat
        data_type: varchar
        description: '{{ doc("col__jcat") }}'
      - name: jcat_link_method
        data_type: varchar
        description: '{{ doc("col__jcat_link_method") }}'
      - name: flag_gcat_matched
        data_type: integer
        description: '{{ doc("col__flag_gcat_matched") }}'
      - name: object_name
        data_type: varchar
        description: '{{ doc("col__object_name") }}'
        config:
          meta:
            label: "Satellite name"
      - name: object_id
        data_type: varchar
        description: '{{ doc("col__object_id") }}'
      - name: object_type
        data_type: varchar
        description: '{{ doc("col__object_type__resolved") }}'
      - name: object_type_source
        data_type: varchar
        description: '{{ doc("col__object_type_source") }}'
      - name: flag_in_orbit
        data_type: integer
        description: '{{ doc("col__flag_in_orbit") }}'
      - name: flag_orbit_conflict
        data_type: integer
        description: '{{ doc("col__flag_orbit_conflict") }}'
      - name: operational_status
        data_type: varchar
        description: '{{ doc("col__operational_status") }}'
        config:
          meta:
            label: "Status"
        data_tests:
          - accepted_values:
              name: accepted_values__fct__satellite_master__operational_status
              arguments: {values: ["Active", "Inactive"]}
      - name: operational_status_source
        data_type: varchar
        description: '{{ doc("col__operational_status_source") }}'
        data_tests:
          - accepted_values:
              name: accepted_values__fct__satellite_master__operational_status_source
              arguments: {values: ["gcat_psatcat", "gcat_currentcat", "default_inactive", "space_track_object_type"]}
      - name: flag_still_operating
        data_type: integer
        description: '{{ doc("col__flag_still_operating") }}'
      - name: flag_still_transmitting
        data_type: integer
        description: '{{ doc("col__flag_still_transmitting") }}'
      - name: end_operation_date
        data_type: timestamp
        description: '{{ doc("col__end_operation_date") }}'
      - name: end_operation_date_precision
        data_type: varchar
        description: '{{ doc("col__end_operation_date_precision") }}'
      - name: end_transmission_date
        data_type: timestamp
        description: '{{ doc("col__end_transmission_date") }}'
      - name: end_transmission_date_precision
        data_type: varchar
        description: '{{ doc("col__end_transmission_date_precision") }}'
      - name: end_of_life_code
        data_type: varchar
        description: '{{ doc("col__end_of_life_code") }}'
      - name: activity_type
        data_type: varchar
        description: '{{ doc("col__activity_type") }}'
      - name: current_status
        data_type: varchar
        description: '{{ doc("col__current_status") }}'
      - name: launch_date
        data_type: date
        description: '{{ doc("col__launch_date__resolved") }}'
      - name: launch_date_source
        data_type: varchar
        description: '{{ doc("col__launch_date_source") }}'
      - name: launch_year
        data_type: bigint
        description: '{{ doc("col__launch_year") }}'
        config:
          meta:
            label: "Launch year"
      - name: owner_country
        data_type: varchar
        description: '{{ doc("col__owner_country") }}'
        config:
          meta:
            label: "Owner"
        data_tests:
          - elementary.column_anomalies:
              name: anomaly_column__fct__satellite_master__owner_country
              arguments: {column_anomalies: [null_percent]}
              config: {severity: warn}
      - name: owner_country_codes
        data_type: varchar[]
        description: '{{ doc("col__owner_country_codes") }}'
      - name: flag_owner_country_is_org
        data_type: integer
        description: '{{ doc("col__flag_owner_country_is_org") }}'
      - name: owner_country_source
        data_type: varchar
        description: '{{ doc("col__owner_country_source") }}'
        data_tests:
          - accepted_values:
              name: accepted_values__fct__satellite_master__owner_country_source
              arguments:
                values:
                  - iso_exact
                  - iso_split
                  - geonames_name
                  - iso_historic
                  - spacetrack_name
                  - unknown
                  - gcat_state
                  - gcat_state_tbd
                  - none
      - name: spacetrack_country_code
        data_type: varchar
        description: '{{ doc("col__spacetrack_country_code") }}'
      - name: owner_code
        data_type: varchar
        description: '{{ doc("col__owner_code") }}'
      - name: operator_name
        data_type: varchar
        description: '{{ doc("col__operator_name") }}'
      - name: manufacturer_name
        data_type: varchar
        description: '{{ doc("col__manufacturer_name") }}'
      - name: owner_org_codes
        data_type: varchar[]
        description: '{{ doc("col__owner_org_codes") }}'
      - name: owner_org_names
        data_type: varchar[]
        description: '{{ doc("col__owner_org_names") }}'
      - name: manufacturer_org_codes
        data_type: varchar[]
        description: '{{ doc("col__manufacturer_org_codes") }}'
      - name: manufacturer_org_names
        data_type: varchar[]
        description: '{{ doc("col__manufacturer_org_names") }}'
      - name: launch_agency_org_codes
        data_type: varchar[]
        description: '{{ doc("col__launch_agency_org_codes") }}'
      - name: launch_agency_org_names
        data_type: varchar[]
        description: '{{ doc("col__launch_agency_org_names") }}'
      - name: ownership_class
        data_type: varchar
        description: '{{ doc("col__ownership_class") }}'
      - name: ownership_class_labels
        data_type: varchar[]
        description: '{{ doc("col__ownership_class_labels") }}'
      - name: mission_category_list
        data_type: varchar[]
        description: '{{ doc("col__mission_category_list") }}'
      - name: mission_category_labels
        data_type: varchar[]
        description: '{{ doc("col__mission_category_labels") }}'
        config:
          meta:
            label: "Purpose"
      - name: launch_tag
        data_type: varchar
        description: '{{ doc("col__launch_tag") }}'
      - name: launch_datetime
        data_type: timestamp
        description: '{{ doc("col__launch_datetime") }}'
      - name: launch_datetime_precision
        data_type: varchar
        description: '{{ doc("col__launch_datetime_precision") }}'
      - name: site_code
        data_type: varchar
        description: '{{ doc("col__site_code") }}'
        data_tests:
          - relationships:
              name: fk__fct__satellite_master__site_code
              arguments:
                to: "ref('dim__launch_site')"
                field: site_code
      - name: site_name
        data_type: varchar
        description: '{{ doc("col__site_name") }}'
      - name: site_state
        data_type: varchar
        description: '{{ doc("col__site_state") }}'
      - name: site_location_country
        data_type: varchar
        description: '{{ doc("col__site_location_country") }}'
      - name: site_latitude
        data_type: double
        description: '{{ doc("col__site_latitude") }}'
      - name: site_longitude
        data_type: double
        description: '{{ doc("col__site_longitude") }}'
      - name: launch_vehicle_type
        data_type: varchar
        description: '{{ doc("col__launch_vehicle_type") }}'
        data_tests:
          - relationships:
              name: fk__fct__satellite_master__launch_vehicle_type
              arguments:
                to: "ref('dim__launch_vehicle')"
                field: launch_vehicle_name
      - name: launch_vehicle_brand
        data_type: varchar
        description: '{{ doc("col__launch_vehicle_brand") }}'
        config:
          meta:
            label: "Launch vehicle"
      - name: launch_vehicle_family
        data_type: varchar
        description: '{{ doc("col__launch_vehicle_family") }}'
      - name: flight_id
        data_type: varchar
        description: '{{ doc("col__flight_id") }}'
      - name: launch_agency_code
        data_type: varchar
        description: '{{ doc("col__launch_agency_code") }}'
      - name: launch_agency_name
        data_type: varchar
        description: '{{ doc("col__launch_agency_name") }}'
      - name: launch_category
        data_type: varchar
        description: '{{ doc("col__launch_category") }}'
      - name: flag_catalog_match_uncertain
        data_type: integer
        description: '{{ doc("col__flag_catalog_match_uncertain") }}'
      - name: launch_details_source
        data_type: varchar
        description: '{{ doc("col__launch_details_source") }}'
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              name: accepted_values__fct__satellite_master__launch_details_source
              arguments:
                values:
                  - own
                  - inherited_launch
                  - none
      - name: satellite_program
        data_type: varchar
        description: '{{ doc("col__satellite_program") }}'
      - name: satellite_program_family
        data_type: varchar
        description: '{{ doc("col__satellite_program_family") }}'
      - name: constellation_plane
        data_type: varchar
        description: '{{ doc("col__constellation_plane") }}'
      - name: satellite_constellation_name
        data_type: varchar
        description: '{{ doc("col__satellite_constellation_name") }}'
        config:
          meta:
            label: "Constellation"
        data_tests:
          - relationships:
              name: fk__fct__satellite_master__satellite_constellation_name
              arguments:
                to: "ref('dim__satellite_constellation')"
                field: satellite_constellation_name
      - name: primary_satellite_system_name
        data_type: varchar
        description: '{{ doc("col__primary_satellite_system_name") }}'
        config:
          meta:
            label: "Primary satellite system"
        data_tests:
          - relationships:
              name: fk__fct__satellite_master__primary_satellite_system_name
              arguments:
                to: "ref('dim__satellite_system')"
                field: satellite_system_name
      - name: satellite_system_names
        data_type: varchar[]
        description: '{{ doc("col__satellite_system_names") }}'
        constraints:
          - type: not_null
        config:
          meta:
            label: "Satellite systems"
      - name: flag_space_station
        data_type: integer
        description: '{{ doc("col__flag_space_station") }}'
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              name: accepted_values__fct__satellite_master__flag_space_station
              arguments: {values: [0, 1], quote: false}
      - name: mission_details_source
        data_type: varchar
        description: '{{ doc("col__mission_details_source") }}'
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              name: accepted_values__fct__satellite_master__mission_details_source
              arguments:
                values:
                  - own
                  - inherited_parent
                  - none
      - name: mission_details_parent_jcat
        data_type: varchar
        description: '{{ doc("col__mission_details_parent_jcat") }}'
      - name: orbit_class
        data_type: varchar
        description: '{{ doc("col__orbit_class") }}'
        config:
          meta:
            label: "Orbit type"
      - name: orbit_regime
        data_type: varchar
        description: '{{ doc("col__orbit_regime") }}'
      - name: orbital_period
        data_type: double
        description: '{{ doc("col__orbital_period") }}'
      - name: inclination
        data_type: double
        description: '{{ doc("col__inclination") }}'
      - name: eccentricity
        data_type: double
        description: '{{ doc("col__eccentricity") }}'
      - name: apoapsis
        data_type: double
        description: '{{ doc("col__apoapsis") }}'
      - name: periapsis
        data_type: double
        description: '{{ doc("col__periapsis") }}'
      - name: rcs_size
        data_type: varchar
        description: '{{ doc("col__rcs_size") }}'
      - name: mass_kg
        data_type: double
        description: '{{ doc("col__mass_kg") }}'
      - name: flag_mass_estimated
        data_type: integer
        description: '{{ doc("col__flag_mass_estimated") }}'
      - name: dry_mass_kg
        data_type: double
        description: '{{ doc("col__dry_mass_kg") }}'
      - name: span_m
        data_type: double
        description: '{{ doc("col__span_m") }}'
      - name: epoch
        data_type: timestamp
        description: '{{ doc("col__epoch") }}'
      - name: tle_age_days
        data_type: double
        description: '{{ doc("col__tle_age_days") }}'
      - name: tle_line_1
        data_type: varchar
        description: '{{ doc("col__tle_line_1") }}'
      - name: tle_line_2
        data_type: varchar
        description: '{{ doc("col__tle_line_2") }}'
      - name: positions_as_of
        data_type: timestamp
        description: '{{ doc("col__positions_as_of") }}'
      - name: gcat_updated_at
        data_type: timestamp
        description: '{{ doc("col__gcat_updated_at") }}'
      - name: inserted_date_time
        data_type: timestamp
        description: '{{ doc("col__inserted_date_time") }}'
      - name: inserted_by
        data_type: varchar
        description: '{{ doc("col__inserted_by") }}'

  - name: dim__satellite_constellation
    description: "One row per satellite constellation SatTrack shows (D-047): from CelesTrak (golden source, named by CelesTrak) or from the ad-hoc seed of manual ones with their publisher's details, with how many objects in the GP feed it names."
    config:
      access: public
    data_tests:
      - model_health:
          name: mh__dim__satellite_constellation__pk_unique
          arguments: {check: pk_unique, columns: [satellite_constellation_name]}
      - model_health:
          name: mh__dim__satellite_constellation__pk_not_null
          arguments: {check: pk_not_null, columns: [satellite_constellation_name]}
    columns:
      - name: satellite_constellation_name
        data_type: varchar
        description: '{{ doc("col__satellite_constellation_name") }}'
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              name: accepted_values__dim__satellite_constellation__satellite_constellation_name
              arguments:
                values:
                  - "Starlink"
                  - "OneWeb"
                  - "Kuiper"
                  - "Qianfan"
                  - "Hulianwang Digui"
                  - "Iridium NEXT"
                  - "Globalstar"
                  - "Orbcomm"
                  - "PlanetScope"
                  - "Sentinel-1"
                  - "Sentinel-2"
                  - "Sentinel-3"
              config:
                severity: warn   # a new name from CelesTrak (or GCAT): decide whether it belongs (D-047)
      - name: constellation_origin
        data_type: varchar
        description: '{{ doc("col__constellation_origin") }}'
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              name: accepted_values__dim__satellite_constellation__constellation_origin
              arguments: {values: ["celestrak", "manual"]}
      - name: definition_rule_type
        data_type: varchar
        description: '{{ doc("col__definition_rule_type") }}'
      - name: definition_rule_values
        data_type: varchar
        description: '{{ doc("col__definition_rule_values") }}'
      - name: definition_operator
        data_type: varchar
        description: '{{ doc("col__definition_operator") }}'
      - name: definition_purpose
        data_type: varchar
        description: '{{ doc("col__definition_purpose") }}'
      - name: definition_description
        data_type: varchar
        description: '{{ doc("col__definition_description") }}'
      - name: definition_source_name
        data_type: varchar
        description: '{{ doc("col__definition_source_name") }}'
      - name: definition_source_url
        data_type: varchar
        description: '{{ doc("col__definition_source_url") }}'
      - name: definition_source_quote
        data_type: varchar
        description: '{{ doc("col__definition_source_quote") }}'
      - name: satellite_count
        data_type: integer
        description: '{{ doc("col__satellite_count") }}'
        constraints:
          - type: not_null
      - name: inserted_date_time
        data_type: timestamp
        description: '{{ doc("col__inserted_date_time") }}'
      - name: inserted_by
        data_type: varchar
        description: '{{ doc("col__inserted_by") }}'

  - name: dim__satellite_system
    description: "One row per satellite system SatTrack shows (D-047): from CelesTrak (golden source, named by CelesTrak) or from the ad-hoc seed of manual ones with their publisher's details, with how many objects in the GP feed it names."
    config:
      access: public
    data_tests:
      - model_health:
          name: mh__dim__satellite_system__pk_unique
          arguments: {check: pk_unique, columns: [satellite_system_name]}
      - model_health:
          name: mh__dim__satellite_system__pk_not_null
          arguments: {check: pk_not_null, columns: [satellite_system_name]}
    columns:
      - name: satellite_system_name
        data_type: varchar
        description: '{{ doc("col__satellite_system_name") }}'
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              name: accepted_values__dim__satellite_system__satellite_system_name
              arguments:
                values:
                  - "GPS"
                  - "GLONASS"
                  - "Galileo"
                  - "Beidou"
                  - "Tracking and Data Relay Satellite System (TDRSS)"
                  - "Disaster Monitoring"
                  - "NavIC"
                  - "QZSS"
                  - "Search & Rescue (SARSAT)"
                  - "EGNOS"
                  - "WAAS"
                  - "GAGAN"
                  - "SDCM"
                  - "SOUTHPAN"
                  - "BDSBAS"
                  - "MSAS"
                  - "JPSS"
                  - "GOES"
                  - "Copernicus Sentinels"
              config:
                severity: warn   # a new name from CelesTrak (or GCAT): decide whether it belongs (D-047)
      - name: system_origin
        data_type: varchar
        description: '{{ doc("col__system_origin") }}'
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              name: accepted_values__dim__satellite_system__system_origin
              arguments: {values: ["celestrak", "manual"]}
      - name: definition_rule_type
        data_type: varchar
        description: '{{ doc("col__definition_rule_type") }}'
      - name: definition_rule_values
        data_type: varchar
        description: '{{ doc("col__definition_rule_values") }}'
      - name: definition_operator
        data_type: varchar
        description: '{{ doc("col__definition_operator") }}'
      - name: definition_purpose
        data_type: varchar
        description: '{{ doc("col__definition_purpose") }}'
      - name: definition_description
        data_type: varchar
        description: '{{ doc("col__definition_description") }}'
      - name: definition_source_name
        data_type: varchar
        description: '{{ doc("col__definition_source_name") }}'
      - name: definition_source_url
        data_type: varchar
        description: '{{ doc("col__definition_source_url") }}'
      - name: definition_source_quote
        data_type: varchar
        description: '{{ doc("col__definition_source_quote") }}'
      - name: satellite_count
        data_type: integer
        description: '{{ doc("col__satellite_count") }}'
        constraints:
          - type: not_null
      - name: primary_satellite_count
        data_type: integer
        description: '{{ doc("col__primary_satellite_count") }}'
        constraints:
          - type: not_null
      - name: inserted_date_time
        data_type: timestamp
        description: '{{ doc("col__inserted_date_time") }}'
      - name: inserted_by
        data_type: varchar
        description: '{{ doc("col__inserted_by") }}'

  - name: fct__satellite_system
    description: "One row per satellite per satellite system it belongs to (D-047): its primary system (flag_primary_system 1, at most one per satellite) and any system it hosts a payload for (0), e.g. a Galileo satellite carrying a Cospas-Sarsat repeater."
    config:
      access: public
    data_tests:
      - model_health:
          name: mh__fct__satellite_system__pk_unique
          arguments: {check: pk_unique, columns: [satcat_id, satellite_system_name]}
      - model_health:
          name: mh__fct__satellite_system__pk_not_null
          arguments: {check: pk_not_null, columns: [satcat_id, satellite_system_name]}
    columns:
      - name: satcat_id
        data_type: integer
        description: '{{ doc("col__satcat_id") }}'
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              name: fk__fct__satellite_system__satcat_id
              arguments:
                to: "ref('fct__satellite_master')"
                field: satcat_id
      - name: satellite_system_name
        data_type: varchar
        description: '{{ doc("col__satellite_system_name") }}'
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              name: fk__fct__satellite_system__satellite_system_name
              arguments:
                to: "ref('dim__satellite_system')"
                field: satellite_system_name
      - name: flag_primary_system
        data_type: integer
        description: '{{ doc("col__flag_primary_system") }}'
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              name: accepted_values__fct__satellite_system__flag_primary_system
              arguments: {values: [0, 1], quote: false}
      - name: system_source
        data_type: varchar
        description: '{{ doc("col__system_source") }}'
        constraints:
          - type: not_null
      - name: inserted_date_time
        data_type: timestamp
        description: '{{ doc("col__inserted_date_time") }}'
      - name: inserted_by
        data_type: varchar
        description: '{{ doc("col__inserted_by") }}'
