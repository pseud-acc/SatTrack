models:
  - name: int__jsr__org_organisations
    description: "One row per GCAT Org Code (organisation phase), with the display name rule: English short name, else the host-language short name (GCAT: ShortEName 'can be omitted when ShortName is itself English'). Undocumented class values become NULL."
    data_tests:
      - model_health:
          name: mh__int__jsr__org_organisations__pk_unique
          arguments: {check: pk_unique, columns: [org_code]}
      - model_health:
          name: mh__int__jsr__org_organisations__pk_not_null
          arguments: {check: pk_not_null, columns: [org_code]}
      - model_health:
          name: mh__int__jsr__org_organisations__row_count_match
          arguments:
            check: row_count_match
            compare_to: "ref('stg__jsr__orgs')"
            relationship: equal
    columns:
      - name: org_code
        description: '{{ doc("col__org_code") }}'
      - name: org_ucode
        description: '{{ doc("col__org_ucode") }}'
      - name: org_state_code
        description: '{{ doc("col__org_state_code") }}'
      - name: org_type
        description: '{{ doc("col__org_type") }}'
      - name: org_class
        description: '{{ doc("col__org_class") }}'
      - name: org_display_name
        description: '{{ doc("col__org_display_name") }}'
      - name: org_display_full_name
        description: '{{ doc("col__org_display_full_name") }}'
      - name: org_short_name
        description: '{{ doc("col__org_short_name") }}'
      - name: org_full_name
        description: '{{ doc("col__org_full_name") }}'
      - name: org_short_name_en
        description: '{{ doc("col__org_short_name_en") }}'
      - name: org_full_name_en
        description: '{{ doc("col__org_full_name_en") }}'
      - name: org_location
        description: '{{ doc("col__org_location") }}'
      - name: org_latitude
        description: '{{ doc("col__org_latitude") }}'
      - name: org_longitude
        description: '{{ doc("col__org_longitude") }}'
      - name: org_parent_code
        description: '{{ doc("col__org_parent_code") }}'
      - name: org_start_date
        description: '{{ doc("col__org_start_date") }}'
      - name: org_start_date_start
        description: '{{ doc("col__org_start_date_start") }}'
      - name: org_start_date_end
        description: '{{ doc("col__org_start_date_end") }}'
      - name: org_start_date_precision
        description: '{{ doc("col__org_start_date_precision") }}'
      - name: org_stop_date
        description: '{{ doc("col__org_stop_date") }}'
      - name: org_stop_date_start
        description: '{{ doc("col__org_stop_date_start") }}'
      - name: org_stop_date_end
        description: '{{ doc("col__org_stop_date_end") }}'
      - name: org_stop_date_precision
        description: '{{ doc("col__org_stop_date_precision") }}'
      - name: flag_org_active
        description: '{{ doc("col__flag_org_active") }}'
      - name: flag_country_like
        description: '{{ doc("col__flag_country_like") }}'
      - name: _source_updated_at
        description: '{{ doc("col___source_updated_at") }}'
      - name: inserted_date_time
        description: '{{ doc("col__inserted_date_time") }}'
      - name: inserted_by
        description: '{{ doc("col__inserted_by") }}'
  - name: int__jsr__org_satellite_owner_map
    description: "One row per jcat per owner org, from GCAT composite codes (keeps every co-org)."
    data_tests:
      - model_health:
          name: mh__int__jsr__org_satellite_owner_map__pk_unique
          arguments: {check: pk_unique, columns: [map_sk]}
      - model_health:
          name: mh__int__jsr__org_satellite_owner_map__pk_not_null
          arguments: {check: pk_not_null, columns: [map_sk]}
      - model_health:
          name: mh__int__jsr__org_satellite_owner_map__row_count_match
          arguments:
            check: row_count_match
            compare_to: "ref('int__jsr__satellite_catalogue')"
            relationship: gte
    columns:
      - name: map_sk
        description: '{{ doc("col__map_sk") }}'
      - name: jcat
        description: '{{ doc("col__jcat") }}'
      - name: org_role
        description: '{{ doc("col__org_role") }}'
      - name: org_code
        description: '{{ doc("col__org_code") }}'
        data_tests:
          - relationships:
              name: fk__int__jsr__org_satellite_owner_map__org_code
              arguments: {to: "ref('int__jsr__org_organisations')", field: org_code}
              config: {severity: warn}   # GCAT may cite codes not (yet) in orgs
      - name: org_code_order
        description: '{{ doc("col__org_code_order") }}'
      - name: org_code_raw
        description: '{{ doc("col__org_code_raw") }}'
      - name: flag_multiple_orgs
        description: '{{ doc("col__flag_multiple_orgs") }}'
      - name: flag_org_uncertain
        description: '{{ doc("col__flag_org_uncertain") }}'
      - name: org_code_split_rule
        description: '{{ doc("col__org_code_split_rule") }}'
      - name: org_name
        description: '{{ doc("col__org_name") }}'
      - name: inserted_date_time
        description: '{{ doc("col__inserted_date_time") }}'
      - name: inserted_by
        description: '{{ doc("col__inserted_by") }}'
