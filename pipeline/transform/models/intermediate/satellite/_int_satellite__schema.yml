unit_tests:
  - name: ut__int__celestrak__space_station__station_groups_only
    description: >-
      D-043: an object is a station when it is in a group the config marks `station` (rows shaped like CelesTrak's
      `stations` group, fetch run 45061938995: the ISS and Tiangong); constellation, operator and excluded groups never
      count, and an object listed twice appears once (the ISS's tdrss membership, D-046, doesn't change its flag).
    model: int__celestrak__space_station
    given:
      - input: ref('stg__celestrak__gp_group_member')
        rows:
          - {celestrak_group: stations, satcat_id: 25544}
          - {celestrak_group: stations, satcat_id: 48274}
          - {celestrak_group: visual, satcat_id: 25544}
          - {celestrak_group: tdrss, satcat_id: 25544}
          - {celestrak_group: starlink, satcat_id: 44714}
          - {celestrak_group: gnss, satcat_id: 26407}
      - input: ref('stg__celestrak__group_config')
        rows:
          - {celestrak_group: stations, celestrak_group_kind: station}
          - {celestrak_group: starlink, celestrak_group_kind: constellation}
          - {celestrak_group: tdrss, celestrak_group_kind: constellation, celestrak_group_member_name_prefix: TDRS}
          - {celestrak_group: gnss, celestrak_group_kind: excluded}
          - {celestrak_group: visual, celestrak_group_kind: excluded}
    expect:
      rows:
        - {satcat_id: 25544, flag_space_station: 1}
        - {satcat_id: 48274, flag_space_station: 1}

  - name: ut__int__celestrak__satellite_group_membership__names_and_name_fit
    description: >-
      D-026, D-046, D-047 on rows from CelesTrak's tdrss, dmc and gps-ops groups (fetch run 45061938995). Display
      names drop "Operational"; station and excluded groups never count. Name fit: tdrss's most common leading word is
      TDRS, so HST doesn't fit; dmc's is DMC (DMC3-FM1..3), so BEIJING 1 and HUANJING 1A (HJ-1A) don't (D-046's dmc
      exception is gone); a member-name prefix (made up here for gps-ops) drops members that don't start with it.
    model: int__celestrak__satellite_group_membership
    given:
      - input: ref('stg__celestrak__gp_group_member')
        rows:
          - {celestrak_group: tdrss, satcat_id: 19548, object_name: "TDRS 3"}
          - {celestrak_group: tdrss, satcat_id: 21639, object_name: "TDRS 5"}
          - {celestrak_group: tdrss, satcat_id: 20580, object_name: "HST"}
          - {celestrak_group: dmc, satcat_id: 28890, object_name: "BEIJING 1"}
          - {celestrak_group: dmc, satcat_id: 33320, object_name: "HUANJING 1A (HJ-1A)"}
          - {celestrak_group: dmc, satcat_id: 40715, object_name: "DMC3-FM1"}
          - {celestrak_group: dmc, satcat_id: 40716, object_name: "DMC3-FM2"}
          - {celestrak_group: gps-ops, satcat_id: 26407, object_name: "GPS BIIR-5"}
          - {celestrak_group: gps-ops, satcat_id: 20580, object_name: "HST"}
          - {celestrak_group: stations, satcat_id: 25544, object_name: "ISS (ZARYA)"}
          - {celestrak_group: visual, satcat_id: 25544, object_name: "ISS (ZARYA)"}
      - input: ref('stg__celestrak__gp_group_index')
        rows:
          - {celestrak_group: tdrss, celestrak_group_title: "Tracking and Data Relay Satellite System (TDRSS)"}
          - {celestrak_group: dmc, celestrak_group_title: "Disaster Monitoring"}
          - {celestrak_group: gps-ops, celestrak_group_title: "GPS Operational"}
          - {celestrak_group: stations, celestrak_group_title: "Space Stations"}
          - {celestrak_group: visual, celestrak_group_title: "100 (or so) Brightest"}
      - input: ref('stg__celestrak__group_config')
        rows:
          - {celestrak_group: gps-ops, celestrak_group_kind: system, celestrak_group_order: 9, celestrak_group_member_name_prefix: GPS}
          - {celestrak_group: tdrss, celestrak_group_kind: system, celestrak_group_order: 13, celestrak_group_member_name_prefix: null}
          - {celestrak_group: dmc, celestrak_group_kind: system, celestrak_group_order: 14, celestrak_group_member_name_prefix: null}
          - {celestrak_group: stations, celestrak_group_kind: station, celestrak_group_order: 18, celestrak_group_member_name_prefix: null}
          - {celestrak_group: visual, celestrak_group_kind: excluded, celestrak_group_order: null, celestrak_group_member_name_prefix: null}
    expect:
      rows:
        - {satcat_id: 19548, celestrak_group: tdrss, grouping_name: "Tracking and Data Relay Satellite System (TDRSS)", flag_name_fits_group: 1}
        - {satcat_id: 21639, celestrak_group: tdrss, grouping_name: "Tracking and Data Relay Satellite System (TDRSS)", flag_name_fits_group: 1}
        - {satcat_id: 20580, celestrak_group: tdrss, grouping_name: "Tracking and Data Relay Satellite System (TDRSS)", flag_name_fits_group: 0}
        - {satcat_id: 28890, celestrak_group: dmc, grouping_name: "Disaster Monitoring", flag_name_fits_group: 0}
        - {satcat_id: 33320, celestrak_group: dmc, grouping_name: "Disaster Monitoring", flag_name_fits_group: 0}
        - {satcat_id: 40715, celestrak_group: dmc, grouping_name: "Disaster Monitoring", flag_name_fits_group: 1}
        - {satcat_id: 40716, celestrak_group: dmc, grouping_name: "Disaster Monitoring", flag_name_fits_group: 1}
        - {satcat_id: 26407, celestrak_group: gps-ops, grouping_name: "GPS", flag_name_fits_group: 1}

  - name: ut__int__xsrc__satellite_system_membership__celestrak_then_gcat
    description: >-
      D-047 rules on rows shaped like the 21/22 Nov 2026 data (CelesTrak fetch run 45061938995, GCAT programme
      families from the warehouse). tdrss: TDRS 3 is kept and brings its family, so TDRS 5 (family TDRS, not in
      this CelesTrak sample) joins; HST doesn't fit and has no TDRSS.
      dmc: DMC 3-FM1 fits and brings family DMC, so BEIJING 1 joins through GCAT although its CelesTrak name
      doesn't fit; HJ-1A (family HJ) doesn't. gps-ops: NAVSTAR 1 (10684, retired, not in CelesTrak) joins GPS.
      Manual: IRNSS R1A (family IRNSS) is NavIC; LUCH 5A (no rule) has no system. GOES 14
      (family GOES) is GOES, the GOES 4 AKM rocket body (inherited family) is not. Hosted: METEOSAT 9 and GOES 14 are
      in sarsat, so Cospas-Sarsat-style hosted rows (flag 0) appear beside GOES 14's primary GOES. sbas (umbrella):
      SES-5 (EGNOS/PRN 136) is hosted EGNOS, never "SBAS"; BEIDOU-3 G1 (PRN 130, no token) is hosted BDSBAS through
      the manual PRN row. (The BeiDou GEO's own family is Beidou, but no Beidou system group is in this test.)
    model: int__xsrc__satellite_system_membership
    given:
      - input: ref('int__celestrak__satellite_group_membership')
        rows:
          - {satcat_id: 19548, celestrak_group_kind: system, grouping_name: "TDRSS", flag_name_fits_group: 1}
