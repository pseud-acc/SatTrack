          - {grouping_kind: system, grouping_name: NavIC, definition_rule_type: gcat_program_family, definition_rule_values: IRNSS, flag_hosted_system: 0}
          - {grouping_kind: system, grouping_name: BDSBAS, definition_rule_type: celestrak_member_prn, definition_rule_values: "130|143|144", flag_hosted_system: 1}
          - {grouping_kind: constellation, grouping_name: PlanetScope, definition_rule_type: gcat_program_family, definition_rule_values: Flock}
