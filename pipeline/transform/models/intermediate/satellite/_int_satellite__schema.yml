          - {satcat_id: 38652, celestrak_group_kind: system_hosted_umbrella, grouping_name: "Satellite-Based Augmentation System (WAAS/EGNOS/MSAS)", member_system_token: EGNOS, member_prn: "136", flag_name_fits_group: 0}
          - {satcat_id: 43683, celestrak_group_kind: system_hosted_umbrella, grouping_name: "Satellite-Based Augmentation System (WAAS/EGNOS/MSAS)", member_system_token: null, member_prn: "130", flag_name_fits_group: 0}
          - {satcat_id: 44714, celestrak_group_kind: constellation, grouping_name: "Starlink", flag_name_fits_group: 1}
      - input: ref('stg__sattrack__manual_satellite_grouping')
