  - name: int__celestrak__satellite_group_membership
    description: "One row per object and CelesTrak constellation or system group it is listed in (D-026, D-047), with CelesTrak's display name for the group (title without \"Operational\") and whether the object's name fits the group (D-046 name check; system groups keep only fitting members). Groups of kind station or excluded never count; a group with a member-name prefix counts only members whose name starts with it."
    data_tests:
      - model_health:
          name: mh__int__celestrak__satellite_group_membership__pk_unique
          arguments: {check: pk_unique, columns: [satcat_id, celestrak_group]}
      - model_health:
          name: mh__int__celestrak__satellite_group_membership__pk_not_null
          arguments: {check: pk_not_null, columns: [satcat_id, celestrak_group]}
    columns:
      - name: satcat_id
        description: '{{ doc("col__satcat_id") }}'
      - name: celestrak_group
        description: '{{ doc("col__celestrak_group") }}'
      - name: celestrak_group_kind
        description: '{{ doc("col__celestrak_group_kind") }}'
      - name: celestrak_group_order
        description: '{{ doc("col__celestrak_group_order") }}'
      - name: grouping_name
        description: '{{ doc("col__grouping_name") }}'
        data_tests:
          - not_null:
              name: not_null__int__celestrak__satellite_group_membership__grouping_name
      - name: object_name
        description: '{{ doc("col__object_name") }}'
      - name: expected_name_string
        description: '{{ doc("col__expected_name_string") }}'
      - name: member_system_token
        description: '{{ doc("col__member_system_token") }}'
      - name: member_prn
        description: '{{ doc("col__member_prn") }}'
      - name: flag_name_fits_group
        description: '{{ doc("col__flag_name_fits_group") }}'
        data_tests:
          - accepted_values:
              name: accepted_values__int__celestrak__satellite_group_membership__flag_name_fits_group
              arguments: {values: [0, 1], quote: false}
      - name: inserted_date_time
        description: '{{ doc("col__inserted_date_time") }}'
      - name: inserted_by
        description: '{{ doc("col__inserted_by") }}'

  - name: int__xsrc__satellite_constellation
    description: "One row per object in the GP feed that belongs to a constellation (D-047): near-identical satellites working together. CelesTrak's constellation groups (golden source, named by CelesTrak), plus the few CelesTrak has no group for from the ad-hoc seed manual_satellite_grouping (payloads with their own GCAT payload record, by programme family or name). A CelesTrak group beats a manual row."
    data_tests:
      - model_health:
          name: mh__int__xsrc__satellite_constellation__pk_unique
          arguments: {check: pk_unique, columns: [satcat_id]}
      - model_health:
          name: mh__int__xsrc__satellite_constellation__pk_not_null
          arguments: {check: pk_not_null, columns: [satcat_id]}
    columns:
      - name: satcat_id
        description: '{{ doc("col__satcat_id") }}'
      - name: satellite_constellation_name
        description: '{{ doc("col__satellite_constellation_name") }}'
        data_tests:
          - not_null:
              name: not_null__int__xsrc__satellite_constellation__satellite_constellation_name
      - name: constellation_source
        description: '{{ doc("col__constellation_source") }}'
      - name: constellation_rule_value
        description: '{{ doc("col__constellation_rule_value") }}'
      - name: inserted_date_time
        description: '{{ doc("col__inserted_date_time") }}'
      - name: inserted_by
        description: '{{ doc("col__inserted_by") }}'

  - name: int__xsrc__satellite_system_membership
    description: "One row per object in the GP feed and satellite system it belongs to (D-047). CelesTrak says a system exists, GCAT completes it: system groups keep members whose names fit, then add every own payload of the kept members' programme families; the ad-hoc seed adds NavIC, QZSS, JPSS, GOES and Copernicus Sentinels, and the hosted MSAS and BDSBAS; sarsat gives hosted Cospas-Sarsat memberships; sbas (an umbrella term, never a system) gives each member a hosted membership of the SBAS system its CelesTrak name names (EGNOS, WAAS, ...). CelesTrak's gnss group (an umbrella term, not a system) is not used."
    data_tests:
      - model_health:
          name: mh__int__xsrc__satellite_system_membership__pk_unique
          arguments: {check: pk_unique, columns: [satcat_id, satellite_system_name]}
      - model_health:
          name: mh__int__xsrc__satellite_system_membership__pk_not_null
          arguments: {check: pk_not_null, columns: [satcat_id, satellite_system_name]}
    columns:
      - name: satcat_id
        description: '{{ doc("col__satcat_id") }}'
      - name: satellite_system_name
        description: '{{ doc("col__satellite_system_name") }}'
      - name: flag_primary_system
        description: '{{ doc("col__flag_primary_system") }}'
        data_tests:
          - accepted_values:
              name: accepted_values__int__xsrc__satellite_system_membership__flag_primary_system
              arguments: {values: [0, 1], quote: false}
      - name: system_source
        description: '{{ doc("col__system_source") }}'
        data_tests:
          - accepted_values:
              name: accepted_values__int__xsrc__satellite_system_membership__system_source
              arguments: {values: ["celestrak_system_group", "manual", "celestrak_hosted_group", "celestrak_member_name"]}
      - name: inserted_date_time
        description: '{{ doc("col__inserted_date_time") }}'
      - name: inserted_by
        description: '{{ doc("col__inserted_by") }}'

  - name: int__xsrc__satellite_group_names
    description: "One row per object in a constellation or a satellite system (D-047): its constellation, its primary system and the list of every system it belongs to (primary first, then by name). Feeds fct__satellite_master."
    data_tests:
      - model_health:
