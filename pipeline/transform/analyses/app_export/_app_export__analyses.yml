# Queries behind the app CSV export (lift-and-shift for the live SatTrack Dash app).
# Each analysis produces one CSV file the app reads today, with the app's file name, column names, order and formats.
# scripts/export_app_csvs.py reads each analysis's SQL from this folder, resolves ref() to the live mart and writes
# <analysis name without "app__">.csv into DATA_DIR/app/. Edit the SQL here; the script holds no query logic.
version: 2

analyses:
  - name: app__satcat_tle
    description: >-
      satcat_tle.csv for the app: one row per Earth-orbiting payload with a full element set, in the old file's
      columns (SatCatId ... OrbitClass) less StatusCode, UcsData and OrbitClassEstimated, then the OMM elements
      Space-Track publishes (Epoch ... ObjectId; 29 columns), with 'Unknown' / -1.0 for gaps in the descriptive
      fields because the app drops rows with any missing value. Descriptive fields from fct__satellite_master
      (enrichment); elements and TLE lines from fct__gp_elements (tracking).
  - name: app__objects
    description: >-
      The objects dataset for the browser (objects.json.br / objects.json.gz; docs/app-data-contract.md, decisions
      D-009 to D-011): one record per tracked object with a full element set, of every type (payloads, rocket bodies,
      debris, UNKNOWN), keyed by satcat_id, with the marts' own column names. Elements from fct__gp_elements
      (tracking), descriptive fields from fct__satellite_master (enrichment, left join). Gaps stay null; label lists
      are always lists. scripts/export_app_csvs.py wraps it in the dataset envelope and validates every record
      against app/contracts/objects.schema.json.
  - name: app__last_data_update
    description: >-
      last_data_update.csv for the app: Source, Last Download, Last Update (dd/mm/YYYY, HH:MM:SS); rows SpaceTrack_GP
      and GCAT. The app shows the SpaceTrack_GP row's Last Update (the Space-Track GP download time). Reads only
      fct__satellite_master.
