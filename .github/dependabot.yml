# Dependabot version updates (DRAFT). Keeps the SHA-pinned actions current: Dependabot rewrites the
# SHA and the "# vX.Y.Z" comment together. Note: Dependabot *alerts* do not cover SHA-pinned actions,
# so these weekly version-update PRs are the mechanism that picks up fixes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      # Do not propose a release until it is a week old: most hijacked releases are caught sooner.
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
  # The app (repo root): uv.lock, which Heroku installs from. One grouped weekly PR; each one must pass the
  # Heroku build test before merging, like any other change.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      app:
        patterns:
          - "*"
    labels:
      - dependencies
  # The pipeline (pipeline/): pipeline/uv.lock, one dependency group per environment (pipeline, charts, docs,
  # bouncer). Dependabot leaves the URL-pinned dbt wheels alone: bump those by hand in pipeline/pyproject.toml
  # (both platform URLs), run `uv lock`, and check the locked hashes against the release's SHA256SUMS.
  - package-ecosystem: uv
    directory: /pipeline
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"
    labels:
      - dependencies
