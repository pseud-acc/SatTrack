# Shared job: build the commit the way Heroku builds sattrackapp, run it like an Eco dyno, check it serves.
# Called by pr.yml (required check on PRs) and merge.yml (gate before a deploy). The logic is in
# .github/scripts/heroku_build_check.sh. No secrets, no AWS, read-only token.

name: app build check

on:
  workflow_call:
    inputs:
      run:
        description: "Run this check? From changed-files.yml on PRs (false: the PR touches nothing it covers, and the
          skipped job counts as passing for required checks); merge.yml passes true."
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Heroku build
    if: inputs.run
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build like Heroku, run like a dyno, check it serves
        shell: bash
        run: bash .github/scripts/heroku_build_check.sh
