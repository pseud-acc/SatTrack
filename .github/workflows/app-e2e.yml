# Shared job: the app's browser (E2E) tests (tests/e2e) in headless Chromium, against the app on the committed
# sample with a frozen clock. Called by pr.yml (early signal, not a required check) and merge.yml (the deploy
# waits for it). Third-party requests from the page (analytics, CDN stylesheets, map tiles) are blocked or
# stubbed by the tests, so no hits leave the runner.
# On pull requests the target branch is also checked out (baseline/) so the viewer's start-up check can compare
# this branch with it on the same runner (D-042); the tests start it from there and write the comparison to the
# job summary.
# No secrets, no AWS; network only for package and browser downloads.

name: app e2e

on:
  workflow_call:
    inputs:
      run:
        description: "Run this check? From changed-files.yml on PRs (false: the PR touches nothing it covers, and the
          skipped job counts as passing for required checks); merge.yml passes true."
        type: boolean
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: browser journeys
    if: inputs.run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12.3"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Install the app, Playwright and Chromium
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv-e2e" uv sync --quiet --locked --group e2e --python "$(command -v python)"
          "$RUNNER_TEMP/venv-e2e/bin/python" -m playwright install --with-deps chromium

      - name: Check out the target branch as the start-up baseline (D-042)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: baseline
          persist-credentials: false

      - name: Browser journeys
        env:
          SATTRACK_BASELINE_DIR: ${{ github.event_name == 'pull_request' && format('{0}/baseline', github.workspace) || '' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv-e2e/bin/python" -m pytest tests/e2e -q -ra -p no:cacheprovider -W ignore::DeprecationWarning
