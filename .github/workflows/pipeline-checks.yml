# Shared job: the pipeline's tests and dbt checks. Called by pr.yml (required check on PRs) and merge.yml.
# No data, no warehouse, no secrets; network only for package downloads. Same hash-locked installs as
# pipeline.yml; --locked also fails if a uv.lock is out of step with its pyproject.toml.

name: pipeline checks

on:
  workflow_call:
    inputs:
      run:
        description: "Run this check? From changed-files.yml on PRs (false: the PR touches nothing it covers, and the
          skipped job counts as passing for required checks); merge.yml passes true."
        type: boolean
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: tests + dbt checks
    if: inputs.run
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DO_NOT_TRACK: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12.3"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Install pipeline and bouncer environments
        working-directory: pipeline
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv-pipeline" uv sync --quiet --locked --no-build --only-group pipeline --python "$PY"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv-bouncer" uv sync --quiet --locked --only-group bouncer --python "$PY"

      - name: App lockfile is in step
        run: uv lock --check

      - name: Ingestion tests
        working-directory: pipeline
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv-bouncer/bin/python" -m pytest ingestion/tests -q -ra -p no:cacheprovider

      - name: State script tests (infra/state/sattrack_state.py, fake S3)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv-bouncer/bin/python" -m pytest infra/state/tests -q -ra -p no:cacheprovider

      - name: dbt-bouncer check tests
        working-directory: pipeline/transform
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv-bouncer/bin/python" -m pytest bouncer/tests -q -ra -p no:cacheprovider

      - name: dbt parse (empty database)
        working-directory: pipeline/transform
        env:
          SATTRACK_DB_PATH: ${{ runner.temp }}/empty/sattrack.duckdb
          SATTRACK_OPS_PATH: ${{ runner.temp }}/empty/sattrack_ops.duckdb
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty"
          "$RUNNER_TEMP/venv-pipeline/bin/dbt" deps --profiles-dir .
          "$RUNNER_TEMP/venv-pipeline/bin/dbt" parse --profiles-dir .

      - name: dbt-bouncer project rules
        working-directory: pipeline/transform
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv-bouncer/bin/dbt-bouncer" --config-file bouncer/dbt-bouncer.yml
