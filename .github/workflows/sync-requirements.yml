name: Sync requirements.txt

# Regenerates the app's root requirements.txt (what Heroku installs) from pyproject.toml.
# Public-repo rules as in pipeline.yml: push to main only (no pull_request trigger), actions pinned to
# full commit SHAs, and only this job may write repository contents.

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'poetry.lock'

permissions:
  contents: read

jobs:
  sync-requirements:
    if: github.repository == 'pseud-acc/SatTrack'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install poetry-plugin-export
        run: poetry self add poetry-plugin-export

      - name: Export requirements.txt
        run: |
          poetry export -f requirements.txt --output requirements_temp.txt --without-hashes --without dev
          python -c "import re; content = open('requirements_temp.txt').read(); open('requirements.txt', 'w').write(re.sub(r' ;.*', '', content))"
          rm requirements_temp.txt

      - name: Check for changes
        id: verify_diff
        run: |
          git diff --quiet requirements.txt || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add requirements.txt
          git commit -m "chore: auto-update requirements.txt from Poetry dependencies"
          git push origin HEAD:main
