# Shared job: the app's unit and integration tests (tests/app), on the committed sample (tests/app_data) with a
# frozen clock. Called by pr.yml and merge.yml (the deploy waits for it). No secrets, no AWS, no data beyond the
# sample; network only for package downloads.

name: app tests

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: unit + integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12.3"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Install the app and its dev tools
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv-app" uv sync --quiet --locked --python "$(command -v python)"

      - name: Unit and integration tests
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv-app/bin/python" -m pytest tests/app -q -ra -p no:cacheprovider -W ignore::DeprecationWarning
