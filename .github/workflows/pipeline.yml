# SatTrack daily pipeline. Runs by workflow_dispatch: manually, and daily from AWS EventBridge once the
# scheduler stack (infra/aws/sattrack-scheduler.yaml) is deployed. Setup: infra/aws/README.md.
#
# Public-repo rules this file follows:
#   * No pull_request / pull_request_target / workflow_run triggers: code from forks never runs here.
#   * AWS access only through OIDC into one role whose trust policy pins this repo AND environment
#     "production"; the environment only accepts the default branch.
#   * Every action pinned to a full commit SHA (tag in the comment; SHAs checked with git ls-remote
#     on 2026-11-08). Dependabot proposes updates.
#   * Pipeline output goes to a private log in S3, never to the public Actions log. No artifacts, no
#     caches, no `set -x`, no debug logging. The one exception is the run report (last step,
#     .github/scripts/pipeline_report.py): overall result, stage names and statuses, names of dbt checks
#     that did not pass, and the dates of the data the app serves. No row data, object IDs or secrets.
#   * Any problem (non-zero exit, a held unit, failed commit, stale positions or details) fails the job in
#     that last step, after the state is committed, so GitHub emails the owner. Last good data stays live.

name: sattrack-pipeline

on:
  # The ONLY trigger is an AWS EventBridge rule (infra/aws/sattrack-scheduler.yaml) that calls the
  # workflow_dispatch API once a day at 03:17 UTC (off :00/:30; Space-Track GP at most once an hour).
  # There is deliberately no `schedule:` cron: GitHub disables it after 60 days without repository
  # activity in a public repo, and workflow_dispatch is not subject to that rule.
  workflow_dispatch:
    inputs:
      trigger:
        description: Who started this run
        type: choice
        default: manual
        options:
          - manual
          - eventbridge
      force:
        description: Run even if a successful run committed in the last 12 hours
        type: boolean
        default: false
      dry_run:
        description: "Dry run: pull state and run the pipeline, upload only the private log; commit nothing to S3"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One run at a time, across EventBridge and manual dispatches. Never cancel a running job:
  # a cancelled run would leave its build uncommitted (safe) but waste the Space-Track quota.
  group: sattrack-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pipeline:
    name: daily pipeline
    # Forks never run this job (a fork's token could not assume the role anyway).
    if: github.repository == 'pseud-acc/SatTrack'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SATTRACK_S3_BUCKET: ${{ secrets.SATTRACK_S3_BUCKET }}
      SATTRACK_TRIGGER: ${{ inputs.trigger }}
      SATTRACK_FORCE: ${{ inputs.force && 'true' || 'false' }}
      # A dry run still calls Space-Track (it is a full run); only the final commit to S3 is skipped.
      SATTRACK_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      SATTRACK_GIT_SHA: ${{ github.sha }}
      SATTRACK_RUNNER: github-actions
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12.3"  # same patch release as local runs

      # The `production` environment has no required reviewer on purpose (decided 2026-11-08): the run is
      # unattended, and the environment's "main only" deployment branch rule is the gate.
      - name: Prepare private working dirs
        run: |
          set -euo pipefail
          echo "SATTRACK_DATA_DIR=$RUNNER_TEMP/sattrack-data" >> "$GITHUB_ENV"
          echo "PRIVATE_LOG=$RUNNER_TEMP/private/run.log" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sattrack-data/warehouse" "$RUNNER_TEMP/private"
          : > "$RUNNER_TEMP/private/run.log"

      - name: Install uv
        # Pinned like the other actions; uv itself is pinned too, so the lockfile checks are reproducible.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Install pipeline and report environments
        # Hash-locked installs from pipeline/uv.lock (one lockfile, one dependency group per environment).
        # --locked fails if uv.lock is out of step with pyproject.toml; uv checks every file against its locked
        # hash; --no-build refuses to build anything from source. dbt is the same dbt-oss 2.0.8 local runs use:
        # dbt Labs' Linux release wheel, whose locked hash matches the SHA256SUMS they publish.
        working-directory: pipeline
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv-pipeline" uv sync --quiet --locked --no-build --only-group pipeline --python "$PY"
          # titlecase (via dbt-charts) is published only as source, so this environment may build that one
          # package: its sdist hash is locked, but the build tools uv fetches to build it are not.
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv-charts" uv sync --quiet --locked --only-group charts --python "$PY"
          "$RUNNER_TEMP/venv-pipeline/bin/dbt" --version | grep -q "2.0.8"
          echo "SATTRACK_DBT_BIN=$RUNNER_TEMP/venv-pipeline/bin/dbt" >> "$GITHUB_ENV"
          echo "SATTRACK_REPORTS_PYTHON=$RUNNER_TEMP/venv-charts/bin/python" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv-pipeline/bin" >> "$GITHUB_PATH"

      - name: dbt deps
        working-directory: pipeline/transform
        run: |
          set -euo pipefail
          "$SATTRACK_DBT_BIN" deps >> "$PRIVATE_LOG" 2>&1

      - name: AWS credentials (pull + run, 15 min)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PIPELINE_ROLE_ARN }}
          role-session-name: sattrack-run-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Pull last committed state
        id: gate
        run: |
          set -euo pipefail
          python infra/state/sattrack_state.py pull

      - name: Run pipeline (output to private log only)
        id: run
        if: steps.gate.outputs.run == 'true'
        env:
          # Credentials come from Secrets Manager inside the process (credentials.py); they are never
          # in the GitHub environment. SPACETRACK_USER/PASS are deliberately absent.
          SATTRACK_SPACETRACK_SECRET_ID: ${{ secrets.SATTRACK_SPACETRACK_SECRET_ID }}
          SATTRACK_CREDENTIAL_SOURCE: secretsmanager
          SATTRACK_PUBLIC_LOG: "1"
        working-directory: pipeline
        run: |
          set -uo pipefail
          code=0
          python run_pipeline.py >> "$PRIVATE_LOG" 2>&1 || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "pipeline exit code: $code (details are in the private log in S3)"

      # The app CSVs are written by run_pipeline.py itself (step 8, scripts/export_app_csvs.py) into
      # $SATTRACK_DATA_DIR/app/, which is where `sattrack_state.py push` picks them up; no separate step.

      - name: AWS credentials (push, fresh 15 min)
        if: always() && steps.gate.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PIPELINE_ROLE_ARN }}
          role-session-name: sattrack-push-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Commit state (promote only a good build; dry run = upload the log only)
        id: push
        if: always() && steps.gate.outputs.run == 'true'
        env:
          PIPELINE_EXIT: ${{ steps.run.outputs.exit_code || '99' }}
        run: |
          set -euo pipefail
          python infra/state/sattrack_state.py push --pipeline-exit "$PIPELINE_EXIT" --log-file "$PRIVATE_LOG"

      - name: Run report (public) and alert on problems
        if: always()
        env:
          GATE: ${{ steps.gate.outputs.run }}
          PIPELINE_EXIT: ${{ steps.run.outputs.exit_code }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: python .github/scripts/pipeline_report.py

      - name: Remove local data
        if: always()
        run: rm -rf "$RUNNER_TEMP/sattrack-data" "$RUNNER_TEMP/private"
