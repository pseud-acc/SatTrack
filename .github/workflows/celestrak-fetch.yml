# One-off CelesTrak download for analysis and local testing (D-008, D-026). CelesTrak has blocked the owner's IP, so
# requests are made from GitHub's runners. Runs only on demand: a manual dispatch, or adding a label to a pull
# request: `fetch-celestrak` (every group) or `fetch-celestrak-policy` (only the usage-policy page, one request). Never on a schedule or on push. One request per group with a pause between;
# the first refusal stops the run with no retries. Output is a short-lived workflow artifact, never committed:
#   gh run download <run id> -n celestrak-groups -D <folder outside the repo>
# No secrets and no AWS.

name: celestrak fetch

on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Comma-separated CelesTrak group names (empty: every group on the GP index page)"
        required: false
        default: ""
      pages:
        description: "Comma-separated celestrak.org page paths to archive instead of groups (e.g. usage-policy.php)"
        required: false
        default: ""
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: celestrak-fetch
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fetch:
    name: fetch CelesTrak groups
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.label.name == 'fetch-celestrak' ||
      github.event.label.name == 'fetch-celestrak-policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12.3"

      - name: Download groups
        env:
          GROUPS: ${{ inputs.groups }}
          PAGES: ${{ github.event.label.name == 'fetch-celestrak-policy' && 'usage-policy.php' || inputs.pages }}
        run: |
          python pipeline/scripts/celestrak_fetch.py "$RUNNER_TEMP/celestrak" ${PAGES:+--pages "$PAGES"} ${GROUPS:+--groups "$GROUPS"}

      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: celestrak-groups
          path: ${{ runner.temp }}/celestrak
          retention-days: 7
          if-no-files-found: error
