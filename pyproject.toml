# The SatTrack web app (Dash, served by gunicorn on Heroku). Managed with uv: `uv sync` for local
# development, `uv lock` after changing dependencies. Heroku installs from uv.lock with
# `uv sync --locked --no-default-groups`, i.e. only [project].dependencies, never the dev group.
# The pipeline is a separate uv project in pipeline/ with its own lockfile; none of its packages
# reach Heroku.
[project]
name = "sattrack"
version = "2.1.0"
description = "An open-source real-time satellite tracking app for visualising active and inactive satellites orbiting the Earth"
authors = [{ name = "Francis Nwobu" }]
readme = "README.md"
license = "MIT"
keywords = ["satellite", "tracking", "visualization", "orbital", "TLE", "space"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.12,<3.13"
# Only what app/ and run_app.py import, plus gunicorn (the Procfile's web server).
dependencies = [
    "boto3>=1.43.126,<2",
    "dash>=2.12.1,<3",
    "dash-bootstrap-components>=1.1.0,<2",
    "gunicorn>=20.1.0,<21",
    "numpy>=1.26.0,<2",
    "pandas>=2.1.0,<3",
    "pillow>=10.0.0,<11",
    "plotly>=5.7.0,<6",
    "sgp4>=2.21,<3",
]

[project.urls]
Homepage = "https://sattrackapp.herokuapp.com/"
Repository = "https://github.com/pseud-acc/SatTrack"

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8",
    "black>=23.7.0,<24",
    "flake8>=6.1.0,<7",
    "mypy>=1.5.0,<2",
]

[tool.uv]
# An app, not a library: uv installs its dependencies but doesn't build or install the project itself.
package = false

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
